<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="300" height="200" fill="url(#bgGradient)"/>
  
  <!-- 装饰圆圈 -->
  <circle cx="80" cy="50" r="20" fill="white" fill-opacity="0.1"/>
  <circle cx="250" cy="150" r="30" fill="white" fill-opacity="0.1"/>
  <circle cx="220" cy="40" r="15" fill="white" fill-opacity="0.15"/>
  
  <!-- 主图标 -->
  <g transform="translate(150, 100)">
    <!-- 书本背景 -->
    <rect x="-25" y="-15" width="50" height="30" rx="4" fill="white" fill-opacity="0.2"/>
    <rect x="-20" y="-10" width="40" height="20" rx="2" fill="white"/>
    
    <!-- 播放按钮 -->
    <circle cx="0" cy="0" r="18" fill="url(#iconGradient)"/>
    <polygon points="-6,-4 -6,4 6,0" fill="white"/>
  </g>
  
  <!-- 标题文字 -->
  <text x="150" y="160" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">课程封面</text>
  <text x="150" y="180" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" opacity="0.8">Course Cover</text>
</svg>