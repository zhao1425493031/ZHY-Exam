{% extends "base.html" %}

{% block title %}注册 - 在线考试系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-header text-center">
                <h4><i class="bi bi-person-plus"></i> 用户注册</h4>
            </div>
            <div class="card-body">
                <form method="POST" id="registerForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱地址</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" required>
                            <button class="btn btn-outline-secondary" type="button" id="sendCodeBtn">
                                发送验证码
                            </button>
                        </div>
                        <div class="form-text">我们将向此邮箱发送验证码</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="code" class="form-label">验证码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                            <input type="text" class="form-control" id="code" name="code" maxlength="6" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="form-text">密码长度至少6位</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">确认密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-person-plus"></i> 注册
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <p class="text-muted">已有账号？ <a href="{{ url_for('login') }}">立即登录</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    let countdown = 0;
    
    // 发送验证码
    $('#sendCodeBtn').click(function() {
        const email = $('#email').val();
        if (!email) {
            alert('请先输入邮箱地址');
            return;
        }
        
        if (countdown > 0) {
            return;
        }
        
        $.ajax({
            url: '{{ url_for("send_code") }}',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({email: email}),
            success: function(response) {
                if (response.success) {
                    alert('验证码已发送到您的邮箱');
                    startCountdown();
                } else {
                    alert(response.message);
                }
            },
            error: function() {
                alert('发送失败，请重试');
            }
        });
    });
    
    // 倒计时
    function startCountdown() {
        countdown = 60;
        $('#sendCodeBtn').prop('disabled', true);
        
        const timer = setInterval(function() {
            countdown--;
            $('#sendCodeBtn').text(countdown + '秒后重发');
            
            if (countdown <= 0) {
                clearInterval(timer);
                $('#sendCodeBtn').prop('disabled', false).text('发送验证码');
            }
        }, 1000);
    }
    
    // 表单验证
    $('#registerForm').submit(function(e) {
        const password = $('#password').val();
        const confirmPassword = $('#confirm_password').val();
        
        if (password !== confirmPassword) {
            e.preventDefault();
            alert('两次输入的密码不一致');
            return false;
        }
        
        if (password.length < 6) {
            e.preventDefault();
            alert('密码长度至少6位');
            return false;
        }
    });
});
</script>
{% endblock %}
